[package]
name = "bak-cli"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[[bin]]
name = "bak"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bak-core = { version = "0.1.0", path = "../bak-core" }
bak-engine-rustic = { version = "0.1.0", path = "../bak-engine-rustic" }
clap = { version = "4.6.7", features = ["derive", "env"] }
env_logger = "0.11.11"
indicatif = "0.18.6"
log = "0.4.34"
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
