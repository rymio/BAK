[package]
name = "bak-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Backup server for bak, speaking restic's REST protocol"

[lints]
workspace = true

[[bin]]
name = "bak-server"
path = "src/main.rs"

[dependencies]
base64 = "0.23"
bcrypt = "0.19.3"
bytes = "1"
clap = { version = "4.6", features = ["derive"] }
futures-util = "0.3.34"
http-body-util = "0.1.5"
hyper = { version = "1.12", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
rpassword = "7"
rustls = "0.23.45"
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1.53", features = ["rt-multi-thread", "net", "fs", "io-util", "macros", "sync", "signal", "time"] }
tokio-rustls = "0.26.6"
tokio-util = { version = "0.7.20", features = ["io"] }

[dev-dependencies]
tempfile = "3.27.0"
